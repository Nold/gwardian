name: CI iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'bindings/**'
      - 'core/**'
      - 'transfer/**'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'bindings/**'
      - 'core/**'
      - 'transfer/**'
      - '.github/workflows/ci-ios.yml'

jobs:
  build:
    name: Build iOS App
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
            bindings/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('core/Cargo.lock', 'bindings/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Install uniffi-bindgen
        run: cargo install uniffi-bindgen-cli --version 0.28.3 || true

      - name: Build iOS XCFramework
        run: ./scripts/build-ios.sh
        env:
          SKIP_SIMULATOR: "false"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ios/Ash/Ash.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build iOS App (Debug)
        working-directory: apps/ios/Ash
        run: |
          xcodebuild build \
            -project Ash.xcodeproj \
            -scheme Ash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run pad transfer tests
        working-directory: apps/ios/Ash
        run: |
          # Without pipefail the step would take tee's exit status and never fail
          set -o pipefail
          # Newest iPhone simulator Xcode offers for this scheme: older runtimes
          # are installed too, but the app needs iOS 26.1 or later
          DEVICE_ID=$(xcodebuild -showdestinations -project Ash.xcodeproj -scheme Ash 2>/dev/null | python3 -c '
          import re, sys
          best = None
          for line in sys.stdin:
              m = re.search(r"platform:iOS Simulator.*?id:([0-9A-F-]+).*?OS:([0-9.]+).*?name:iPhone", line)
              if m:
                  version = tuple(int(x) for x in m.group(2).split("."))
                  if best is None or version > best[0]:
                      best = (version, m.group(1))
          print(best[1] if best else "")')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error title=No iPhone simulator::xcodebuild -showdestinations listed no iPhone simulator"
            exit 1
          fi
          if ! xcodebuild test \
            -project Ash.xcodeproj \
            -scheme Ash \
            -destination "id=$DEVICE_ID" \
            -only-testing:AshTests/PadTransferFlowTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|failed|passed|Test (Suite|Case)" ; then
            msg=$(grep -E "error:|failed|xcodebuild: error" test.log | head -30 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=iOS tests failed::${msg}"
            exit 1
          fi

  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: apps/ios/Ash
        run: swiftlint lint --reporter github-actions-logging || true

  test-bindings:
    name: Test Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/target/
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('bindings/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bindings-

      - name: Run bindings tests
        working-directory: bindings
        run: cargo test --verbose

      - name: Clippy bindings
        working-directory: bindings
        run: cargo clippy --lib -- -D warnings
