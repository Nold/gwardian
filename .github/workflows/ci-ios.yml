name: CI iOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'bindings/**'
      - 'core/**'
      - 'transfer/**'
      - '.github/workflows/ci-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'bindings/**'
      - 'core/**'
      - 'transfer/**'
      - '.github/workflows/ci-ios.yml'

jobs:
  build:
    name: Build iOS App
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
            bindings/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('core/Cargo.lock', 'bindings/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Install uniffi-bindgen
        run: cargo install uniffi-bindgen-cli --version 0.28.3 || true

      - name: Build iOS XCFramework
        run: ./scripts/build-ios.sh
        env:
          SKIP_SIMULATOR: "false"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ios/Ash/Ash.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build iOS App (Debug)
        working-directory: apps/ios/Ash
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project Ash.xcodeproj \
            -scheme Ash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation, readable without the full log
            msg=$(grep -E "error:" build.log | sort -u | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=iOS build failed::${msg}"
            exit 1
          fi

      - name: Run pad transfer and app lock tests
        working-directory: apps/ios/Ash
        run: |
          # Without pipefail the step would take tee's exit status and never fail
          set -o pipefail
          # Newest iPhone simulator Xcode offers for this scheme: older runtimes
          # are installed too, but the app needs iOS 26.1 or later
          DEVICE_ID=$(xcodebuild -showdestinations -project Ash.xcodeproj -scheme Ash 2>/dev/null | python3 -c '
          import re, sys
          best = None
          for line in sys.stdin:
              m = re.search(r"platform:iOS Simulator.*?id:([0-9A-F-]+).*?OS:([0-9.]+).*?name:iPhone", line)
              if m:
                  version = tuple(int(x) for x in m.group(2).split("."))
                  if best is None or version > best[0]:
                      best = (version, m.group(1))
          print(best[1] if best else "")' || true)
          if [ -z "$DEVICE_ID" ]; then
            # Some runner images list no simulator there: use, or create, an
            # iPhone on the newest installed iOS runtime
            DEVICE_ID=$(xcrun simctl list -j devices available runtimes devicetypes | python3 -c '
          import json, re, subprocess, sys
          data = json.load(sys.stdin)
          def version(identifier):
              m = re.search(r"iOS-(\d+)-(\d+)", identifier)
              return (int(m.group(1)), int(m.group(2))) if m else None
          runtimes = [r for r in data["runtimes"] if r.get("isAvailable") and version(r["identifier"])]
          if not runtimes:
              sys.exit("no iOS simulator runtime installed")
          newest = max(runtimes, key=lambda r: version(r["identifier"]))
          for device in data["devices"].get(newest["identifier"], []):
              if device.get("isAvailable") and device["name"].startswith("iPhone"):
                  print(device["udid"]); sys.exit()
          phones = [t for t in data["devicetypes"] if t["name"].startswith("iPhone")]
          if not phones:
              sys.exit("no iPhone device type")
          print(subprocess.check_output(["xcrun", "simctl", "create", "CI iPhone",
                                         phones[-1]["identifier"], newest["identifier"]], text=True).strip())' || true)
          fi
          if [ -z "$DEVICE_ID" ]; then
            msg=$( { xcodebuild -showdestinations -project Ash.xcodeproj -scheme Ash 2>&1; xcrun simctl list runtimes 2>&1; } \
              | tail -30 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=No iPhone simulator::${msg}"
            exit 1
          fi
          if ! xcodebuild test \
            -project Ash.xcodeproj \
            -scheme Ash \
            -destination "id=$DEVICE_ID" \
            -only-testing:AshTests/PadTransferFlowTests \
            -only-testing:AshTests/LockPolicyTests \
            -only-testing:AshTests/PasscodeVaultTests \
            -only-testing:AshTests/VaultedKeychainServiceTests \
            -only-testing:AshTests/AppLockViewModelTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|failed|passed|Test (Suite|Case)" ; then
            msg=$(grep -E "error:|failed|xcodebuild: error" test.log | head -30 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=iOS tests failed::${msg}"
            exit 1
          fi

  swiftlint:
    name: SwiftLint
    # Linux container: does not wait for the scarce macOS runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run SwiftLint
        run: |
          docker run --rm -v "$PWD:/work" -w /work/apps/ios/Ash ghcr.io/realm/swiftlint:0.57.0 \
            swiftlint lint --reporter github-actions-logging || true

  test-bindings:
    name: Test Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/target/
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('bindings/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bindings-

      - name: Run bindings tests
        working-directory: bindings
        run: cargo test --verbose

      - name: Clippy bindings
        working-directory: bindings
        run: cargo clippy --lib -- -D warnings
