# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# App identity: the Play Store package name. Change it once, here, when
# publishing under your own Google Play account (docs/app-identity.md).
# The Kotlin package com.monadial.ash is internal and stays.
gwardian.applicationId=com.monadial.ash

# Non-transitive R classes
android.nonTransitiveRClass=true
